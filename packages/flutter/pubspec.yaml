name: material_plus_ui
description: >-
  Material Design 3 for Flutter, written from the specification and extended
  past it: over 120 components, charts, a data table and a command palette
  included, themed from one source colour. No dependencies.
version: 1.12.0
repository: https://github.com/jooy2/material-plus-ui
homepage: https://material-plus.cdget.com
issue_tracker: https://github.com/jooy2/material-plus-ui/issues
topics:
  - ui
  - widgets
  - material-design
  - design-system
  - theming

environment:
  # Flutter 3.41 is where the Dart SDK reached 3.11. Nothing here needs a newer
  # language feature, and the floor is deliberately below the release that
  # started moving Material and Cupertino out of the framework: this package
  # imports neither, so it is unaffected either way.
  sdk: ^3.11.0
  flutter: '>=3.41.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

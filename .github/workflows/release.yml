name: release

# Publishes a package to its registry and writes its GitHub release, for every
# version tag and nothing else. Each package is tagged by hand once the commit
# that cut its version is on `main`. What this adds is everything after that:
# the check that the tag names the version that was cut, the package published
# through the registry's trusted publishing, and the release written from that
# version's changelog section.
#
# Neither registry is given a token. Both trust this workflow through OpenID
# Connect: GitHub signs a short-lived token for the job, and npm and pub.dev
# accept it because they were told which repository, workflow and environment
# to expect. CONTRIBUTING.md has the settings each registry needs.
#
# The two packages version independently, so a tag names the package:
# `react-v1.12.0` or `flutter-v1.12.0`. The tests are not run again here: the
# tag goes on a `main` commit whose CI has already passed. The test and deploy
# workflows filter their pushes by branch, so a tag push starts only this.
on:
  push:
    tags:
      - 'react-v*'
      - 'flutter-v*'

permissions:
  contents: read

# Two pushes of the same tag are the same release; the second waits.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  react:
    if: startsWith(github.ref_name, 'react-v')
    runs-on: ubuntu-latest
    name: Publish the React package
    timeout-minutes: 15
    # Named in npm's trusted publisher settings, and the place to put required
    # reviewers in front of a publish.
    environment: npm
    permissions:
      contents: write
      id-token: write
    defaults:
      run:
        working-directory: ./packages/react

    steps:
      - uses: actions/checkout@v5
      # No dependency cache: a release build installs from the lockfile and
      # nothing else, so a cache written by another run cannot reach a publish.
      # `registry-url` writes the `.npmrc` that points `npm publish` at the
      # registry the trusted publisher is configured on.
      - uses: actions/setup-node@v6
        name: Setup Node.js
        with:
          node-version: '26'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      # Trusted publishing needs npm 11.5.1. Node 26 ships a newer one, and this
      # says so in one line rather than as an authentication error at the end.
      - name: Check the npm version
        run: |
          node -e '
            const [major, minor, patch] = process.argv[1].split(".").map(Number);
            const ok = major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1)));
            if (!ok) {
              console.error(`::error::npm ${process.argv[1]} cannot publish through OIDC; 11.5.1 or later is needed.`);
              process.exit(1);
            }
          ' "$(npm --version)"

      # The tag is typed by hand and the version is in two files; a tag pushed
      # onto the wrong commit would otherwise publish a tarball that says
      # something else.
      - name: Check the tag names the version in package.json
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "react-v${version}" ]; then
            echo "::error::The tag is ${GITHUB_REF_NAME} and package.json says ${version}. Tag the commit that cut react-v${version}."
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "name=$(node -p "require('./package.json').name")" >> "$GITHUB_OUTPUT"

      # First, so a tag on a commit whose changelog still says `vNext` fails in
      # seconds rather than after the build.
      - name: Write the release notes from CHANGELOG.md
        run: node ../../.github/scripts/release-notes.mjs "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"

      # Without scripts: `prepare` is the build, and `npm pack` runs it below,
      # so installing with them would build twice.
      - run: npm ci --ignore-scripts

      # `npm pack` runs `prepare` and packs what `.npmignore` lets through. The
      # build ends with `measure-bundle.mjs`, which fails it when importing
      # `MPButton` from the barrel pulls in a module that importing it from
      # `material-plus-ui/components/button` does not, or the other way round.
      # The tarball goes to `$RUNNER_TEMP`, outside the checkout.
      - name: Build and pack
        run: npm pack --pack-destination "$RUNNER_TEMP"

      # The tarball that was packed is the one published, so the registry and
      # the GitHub release hold the same bytes. npm signs a provenance statement
      # for it without being asked, because the publish comes through OIDC from
      # a public repository. A pre-release goes out under `next`, which npm
      # requires and which keeps `latest` where it is. A version the registry
      # already has is skipped, so pushing the tag again only rewrites the
      # GitHub release. The registry is asked directly, the way pub.dev is
      # below, with no credentials: it answers 404 for a version it does not
      # have.
      - name: Publish to npm
        env:
          NAME: ${{ steps.version.outputs.name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/${NAME}/${VERSION}")
          case "$status" in
            200) echo "${NAME}@${VERSION} is already on npm; not publishing it again."; exit 0 ;;
            404) ;;
            *) echo "::error::npm answered ${status} for ${NAME}@${VERSION}."; exit 1 ;;
          esac
          tag="latest"
          case "$VERSION" in *-*) tag="next" ;; esac
          npm publish "$(ls "$RUNNER_TEMP"/*.tgz)" --tag "$tag"

      # Created, or brought up to date when the tag is pushed again after a
      # release already exists, so a re-run never fails on its own earlier
      # success. A version with a pre-release part is marked as one.
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tarball=$(ls "$RUNNER_TEMP"/*.tgz)
          notes="$RUNNER_TEMP/notes.md"
          title="Material Plus for React ${VERSION}"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "$title" --notes-file "$notes"
            gh release upload "$GITHUB_REF_NAME" "$tarball" --clobber
          else
            prerelease=""
            case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
            gh release create "$GITHUB_REF_NAME" "$tarball" --verify-tag \
              --title "$title" --notes-file "$notes" $prerelease
          fi

  # The Flutter package goes out in three jobs, because the publish itself is
  # the Dart team's reusable workflow and a reusable workflow is a job of its
  # own. This one fails fast on a wrong tag or an undated changelog, and asks
  # pub.dev whether the version is already there.
  flutter:
    if: startsWith(github.ref_name, 'flutter-v')
    runs-on: ubuntu-latest
    name: Check the Flutter release
    timeout-minutes: 5
    outputs:
      name: ${{ steps.version.outputs.name }}
      version: ${{ steps.version.outputs.version }}
      published: ${{ steps.published.outputs.published }}
    defaults:
      run:
        working-directory: ./packages/flutter

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        name: Setup Node.js
        with:
          node-version: '26'
          package-manager-cache: false

      - name: Check the tag names the version in pubspec.yaml
        id: version
        run: |
          version=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml)
          if [ "${GITHUB_REF_NAME}" != "flutter-v${version}" ]; then
            echo "::error::The tag is ${GITHUB_REF_NAME} and pubspec.yaml says ${version}. Tag the commit that cut flutter-v${version}."
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "name=$(sed -n 's/^name:[[:space:]]*//p' pubspec.yaml)" >> "$GITHUB_OUTPUT"

      - name: Check the changelog has the version
        run: node ../../.github/scripts/release-notes.mjs "$GITHUB_REF_NAME" > /dev/null

      # pub.dev answers 404 for a version it does not have. The first version of
      # a package is always one it has, because pub.dev only lets a workflow
      # publish a package that already exists, and that one is published by
      # hand.
      - name: Ask pub.dev whether the version is out
        id: published
        env:
          NAME: ${{ steps.version.outputs.name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' "https://pub.dev/api/packages/${NAME}/versions/${VERSION}")
          case "$status" in
            200) echo "published=true" >> "$GITHUB_OUTPUT"; echo "${NAME} ${VERSION} is already on pub.dev; not publishing it again." ;;
            404) echo "published=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::pub.dev answered ${status} for ${NAME} ${VERSION}."; exit 1 ;;
          esac

  # Validates the package, packs it in a job with no network and no token, and
  # publishes the archive from a third job that holds the OIDC token and runs
  # nothing of the package's. It sets up Flutter for the validation, since the
  # package depends on the Flutter SDK.
  flutter-publish:
    needs: flutter
    if: needs.flutter.outputs.published != 'true'
    name: Publish the Flutter package
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      working-directory: packages/flutter
      # Named in pub.dev's automated publishing settings, and the place to put
      # required reviewers in front of a publish.
      environment: pub.dev

  flutter-release:
    needs: [flutter, flutter-publish]
    # After a publish, or when there was nothing to publish because pub.dev
    # already had the version; never after a publish that failed.
    if: >-
      always() && needs.flutter.result == 'success' &&
      (needs.flutter-publish.result == 'success' || needs.flutter-publish.result == 'skipped')
    runs-on: ubuntu-latest
    name: GitHub release of the Flutter package
    timeout-minutes: 5
    permissions:
      contents: write
    defaults:
      run:
        working-directory: ./packages/flutter

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        name: Setup Node.js
        with:
          node-version: '26'
          package-manager-cache: false

      - name: Write the release notes from CHANGELOG.md
        run: node ../../.github/scripts/release-notes.mjs "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"

      # The archive pub.dev was given, left behind by the publish workflow. A
      # re-run that published nothing has none, and the release keeps the one
      # it was first given.
      - uses: actions/download-artifact@v8
        if: needs.flutter-publish.result == 'success'
        with:
          name: package-archive
          path: ${{ runner.temp }}/archive

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NAME: ${{ needs.flutter.outputs.name }}
          VERSION: ${{ needs.flutter.outputs.version }}
        run: |
          notes="$RUNNER_TEMP/notes.md"
          title="Material Plus for Flutter ${VERSION}"
          archive=""
          if [ -f "$RUNNER_TEMP/archive/package.tar.gz" ]; then
            archive="$RUNNER_TEMP/${NAME}-${VERSION}.tar.gz"
            mv "$RUNNER_TEMP/archive/package.tar.gz" "$archive"
          fi
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "$title" --notes-file "$notes"
            if [ -n "$archive" ]; then
              gh release upload "$GITHUB_REF_NAME" "$archive" --clobber
            fi
          else
            prerelease=""
            case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
            gh release create "$GITHUB_REF_NAME" $archive --verify-tag \
              --title "$title" --notes-file "$notes" $prerelease
          fi

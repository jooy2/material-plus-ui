name: publish-documentation

on:
  # Every push that can change what the site shows: its own pages, either
  # package's source (the React previews read it, the Flutter previews are
  # built from it), or either changelog.
  push:
    branches: [main]
    paths:
      - docs/**
      - packages/react/src/**
      - packages/react/CHANGELOG.md
      - packages/react/package.json
      - packages/flutter/lib/**
      - packages/flutter/example/**
      - packages/flutter/CHANGELOG.md
      - .github/workflows/publish-documentation.yml
  # trigger deployment manually
  workflow_dispatch:

defaults:
  run:
    working-directory: ./docs

jobs:
  publish-documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5
        with:
          # fetch all commits to get last updated time or other git log info
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: |
            docs/package-lock.json
            packages/react/package-lock.json

      # The Flutter previews are the real package compiled for the web, which
      # `npm run build` does through `scripts/build-flutter-demos.mjs`.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The React previews read `packages/react/src`, whose imports resolve
      # against that package's dependencies. Its build is not needed.
      - name: Install the React package's dependencies
        run: npm ci --ignore-scripts
        working-directory: ./packages/react

      - name: Install the site's dependencies
        run: npm ci

      # `build` writes both changelogs into each locale, builds the Flutter
      # gallery into `public/flutter`, then builds the site.
      - name: Build VitePress site
        run: npm run build

      # please check out the docs of the workflow for more details
      # @see https://github.com/crazy-max/ghaction-github-pages
      - name: Deploy to GitHub Pages
        uses: crazy-max/ghaction-github-pages@v4
        with:
          # deploy to gh-pages branch
          target_branch: gh-pages
          # deploy the default output dir of VitePress
          build_dir: docs-dist
          jekyll: false
          fqdn: 'material-plus.cdget.com'
        env:
          # @see https://docs.github.com/en/actions/reference/authentication-in-a-workflow#about-the-github_token-secret
          GITHUB_TOKEN: ${{ secrets.ACCESS_TOKEN }}
